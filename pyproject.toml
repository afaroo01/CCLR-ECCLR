[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantdisease"
version = "0.1.0"
description = "Reproducible supervised and few-shot plant-disease classification experiments (EfficientNet / ViT with AutoAugment, CutMix, CCLR and ECCLR)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "psutil>=5.9",
    "tqdm>=4.65",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter"]
# dataset generation, near duplicate check, controls and statistics scripts
analysis = ["scipy>=1.10", "imagehash>=4.3", "requests>=2.31", "rembg>=2.0.50", "onnxruntime>=1.16", "transformers>=4.40", "python-docx>=1.1"]

[project.scripts]
plantdisease = "plantdisease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
