# EfficientNet-B0 (torchvision, ImageNet weights) + the training recipe of exp1-4.
model:
  name: efficientnet
  variant: efficientnet_b0
  pretrained: true

train:
  epochs: 25
  optimizer: {name: adam, lr: 1.0e-3, weight_decay: 0.0}
  scheduler: {name: step, step_size: 5, gamma: 0.1}
  early_stopping: {monitor: val_loss, patience: 5, min_delta: 0.0}
