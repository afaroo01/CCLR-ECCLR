_base_: [_fewshot_base.yaml, ../../models/vit_tiny.yaml]
name: fewshot_ecclr_vit_10shot
description: 8-way 10-shot Prototypical Network on the exp8_vit_ecclr backbone; source = ECCLR PlantVillage, target = PlantDoc.
data:
  source: plantvillage_ecclr
model:
  pretrained: false   # weights come from the checkpoint below
  checkpoint: ${output_dir}/exp8_vit_ecclr/seed_{seed}/checkpoints/best.pt
fewshot:
  n_shot: 10
