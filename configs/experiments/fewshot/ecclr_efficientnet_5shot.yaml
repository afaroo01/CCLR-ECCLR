_base_: [_fewshot_base.yaml, ../../models/efficientnet_b0.yaml]
name: fewshot_ecclr_efficientnet_5shot
description: 8-way 5-shot Prototypical Network on the exp4_efficientnet_ecclr backbone; source = ECCLR PlantVillage, target = PlantDoc.
data:
  source: plantvillage_ecclr
model:
  pretrained: false   # weights come from the checkpoint below
  checkpoint: ${output_dir}/exp4_efficientnet_ecclr/seed_{seed}/checkpoints/best.pt
fewshot:
  n_shot: 5
