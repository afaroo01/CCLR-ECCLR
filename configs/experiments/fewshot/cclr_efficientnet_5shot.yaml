_base_: [_fewshot_base.yaml, ../../models/efficientnet_b0.yaml]
name: fewshot_cclr_efficientnet_5shot
description: 8-way 5-shot Prototypical Network on the exp3_efficientnet_cclr backbone; source = CCLR PlantVillage, target = PlantDoc.
data:
  source: plantvillage_cclr
model:
  pretrained: false   # weights come from the checkpoint below
  checkpoint: ${output_dir}/exp3_efficientnet_cclr/seed_{seed}/checkpoints/best.pt
fewshot:
  n_shot: 5
